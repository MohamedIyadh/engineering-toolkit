<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Engineering Toolkit</title><style>body{font-family:Arial,sans-serif;background:#0f172a;color:#fff;max-width:1000px;margin:auto;padding:20px}.card{background:#1e293b;padding:20px;border-radius:12px;margin:15px 0}input,select{padding:8px;margin:5px;width:120px}button{padding:8px 12px}.result{font-weight:bold;color:#38bdf8}</style></head><body><h1>⚡ Engineering Toolkit</h1><div class="card"><h2>Ohm's Law</h2><input id=v placeholder='V'><input id=i placeholder='A'><input id=r placeholder='Ω'><button onclick='ohm()'>Calculate</button><div id=ores class=result></div></div><div class="card"><h2>Power Calculator</h2><input id=p placeholder='W'><input id=s placeholder='VA'><button onclick='power()'>Calculate PF</button><div id=pres class=result></div></div><div class="card"><h2>Resistor Network</h2><select id=mode><option value=series>Series</option><option value=parallel>Parallel</option></select><div id=list><input class=res placeholder='Ω'></div><button onclick='addR()'>Add Resistor</button><button onclick='calcR()'>Calculate</button><div id=rres class=result></div></div><script>function num(x){let n=parseFloat(x);return isNaN(n)?null:n}function ohm(){let V=num(v.value),I=num(i.value),R=num(r.value);let f=[V,I,R].filter(x=>x!=null).length;if(f!=2){ores.innerText='Enter exactly 2 values';return;}if(V==null)ores.innerText='Voltage = '+(I*R).toFixed(3)+' V';else if(I==null)ores.innerText='Current = '+(V/R).toFixed(3)+' A';else ores.innerText='Resistance = '+(V/I).toFixed(3)+' Ω';}function power(){let P=num(p.value),S=num(s.value);if(P==null||S==null||S==0){pres.innerText='Enter P and S';return;}pres.innerText='Power Factor = '+(P/S).toFixed(4);}function addR(){let i=document.createElement('input');i.className='res';i.placeholder='Ω';document.getElementById('list').appendChild(document.createElement('br'));document.getElementById('list').appendChild(i);}function calcR(){let vals=[...document.querySelectorAll('.res')].map(x=>parseFloat(x.value)).filter(x=>!isNaN(x)&&x>0);if(!vals.length)return;let t=0;if(mode.value==='series')t=vals.reduce((a,b)=>a+b,0);else t=1/vals.reduce((a,b)=>a+1/b,0);rres.innerText='Total Resistance = '+t.toFixed(3)+' Ω';}</script></body></html>
